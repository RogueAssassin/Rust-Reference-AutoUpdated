<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rogue Rust Reference</title>
  <meta name="description" content="Searchable, automatically updated Rust server reference: items with pictures, blueprints, entities, prefabs, convars and commands, plus a static JSON API.">
  <meta name="theme-color" content="#0b0e11">
  <link rel="preconnect" href="https://cdn.carbonmod.gg" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#items">
      <span class="logo">R</span>
      <span class="brand-text"><b>ROGUE <i>RUST</i> <span>REFERENCE</span></b><small>Server intelligence · auto updated</small></span>
    </a>
    <div class="status" id="status" title="">
      <span class="dot"></span>
      <span><b id="statusMain">Checking data…</b><small id="statusSub">&nbsp;</small></span>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Datasets"></nav>

  <main id="main">
    <section class="workspace" id="workspace">
      <aside class="browser" aria-label="Records">
        <div class="browser-head">
          <div>
            <h1 id="sectionTitle">Items</h1>
            <p id="sectionHelp"></p>
          </div>
          <div class="view-toggle" id="viewToggle" hidden>
            <button type="button" data-view="list" title="List view" aria-label="List view">☰</button>
            <button type="button" data-view="grid" title="Grid view" aria-label="Grid view">▦</button>
          </div>
        </div>
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search…">
          <kbd>/</kbd>
        </label>
        <div class="filters" id="filters"></div>
        <div class="count" id="resultCount">&nbsp;</div>
        <div id="results" class="results" tabindex="-1"></div>
        <div class="pager">
          <button type="button" id="prev">‹ Prev</button>
          <span id="pageInfo">1 / 1</span>
          <button type="button" id="next">Next ›</button>
        </div>
      </aside>
      <section id="detail" class="detail" aria-live="polite"></section>
    </section>
    <section class="page" id="page" hidden></section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <footer>
    <span>Rogue Rust Reference · RogueAssassin</span>
    <span>Data mirrored from Carbon's metadata API. Item pictures © Facepunch Studios. Not affiliated with Facepunch or Carbon.</span>
    <a href="https://github.com/RogueAssassin/Rust-Reference-AutoUpdated" rel="noopener">GitHub</a>
  </footer>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
